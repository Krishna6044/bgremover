<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Removal - BG Remover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .feature-list {
            list-style: none;
            margin: 20px 0;
        }
        .feature-list li {
            padding: 10px 0;
            color: #555;
            border-bottom: 1px solid #eee;
        }
        .feature-list li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Background Removal</h1>
        <p>Welcome to BG Remover - Remove image backgrounds instantly with AI!</p>
        
        <ul class="feature-list">
            <li>Upload any image</li>
            <li>Automatic background removal</li>
            <li>Download your result</li>
            <li>View processing history</li>
        </ul>
        
        <p style="color: #667eea; font-weight: 600;">Loading application...</p>
        <div class="loading">
            <div class="spinner"></div>
            <p>Please wait while we prepare your workspace.</p>
        </div>
        
        <div class="button-container">
            <button class="btn-primary" onclick="launchApp()">Launch Application</button>
            <button class="btn-secondary" onclick="viewGitHub()">View on GitHub</button>
        </div>
    </div>

    <script>
        function launchApp() {
            window.location.href = 'https://Krishna6044.github.io/bgremover/app/';
        }
        
        function viewGitHub() {
            window.location.href = 'https://github.com/Krishna6044/bgremover';
        }
        
        // Auto-load after 2 seconds
        setTimeout(() => {
            document.querySelector('.loading').innerHTML = '<p>Ready! Click Launch Application to start.</p>';
        }, 2000);
    </script>
</body>
</html>
